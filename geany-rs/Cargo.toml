[package]
name = "geany-rs"
version = "0.1.0"
edition = "2024"
description = "A fast and lightweight IDE - Built with Rust and egui"

[dependencies]
eframe = "0.32"
egui = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
dirs = "6"
rfd = "0.15"           # Native file dialogs
regex = "1"            # For find/replace and symbol parsing
portable-pty = "0.8"   # Terminal emulator
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
